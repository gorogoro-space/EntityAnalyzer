name: EntityAnalyzer
version: '${version}'
api-version: '1.21.11'
description: EntityAnalyzer
author: kubotan
website: https://github.com/gorogoro-space/EntityAnalyzer
main: space.gorogoro.entityanalyzer.EntityAnalyzer

commands:
  eastatus:
    description: Ranking world entities type
    usage: /<command> [<world_name>] [<entity_name>]
  eatwrank:
    description: Ranking world tile entities
    usage: /<command>
  eawrank:
    description: Ranking world entities
    usage: /<command>
  earank:
    description: Ranking Entity
    usage: /<command> <world_name> <limit>
  eatrank:
    description: Ranking Tile All
    usage: /<command> <world_name> <limit>
  eathrank:
    description: Ranking Tile Hopper
    usage: /<command> <world_name> <limit>
  ealimits:
    description: Show Chank Entity Limits
    usage: /<command> <world_name> <limit>
  ealimitset:
    description: Set Entity/Chank Limits
    usage: /<command> <world_name string> <limit int>
  eanear:
    description: Check Near Chunk
    usage: /<command>
  eareload:
    description: Reload config.yml
    usage: /<command>
